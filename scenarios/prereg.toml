# Slice 0 pass bands. DRAFT: proposed by Paullus, to be agreed with Varro, then frozen
# (commit and SHA-256 recorded in docs/STATUS.md) before any scored run. Definitions are in
# docs/slice0/preregistration.md; the code is crates/cannae-harness/src/metrics.rs.

# A body or side is broken when this share of its standing men have turned.
break_share = 0.4

# 1. A stable standoff.
standoff_min_formed_s = 300.0
standoff_min_median_gap_m = 1.0

# 2. Pulses and lulls.
pulses_min_burstiness = 0.2
pulses_lull_share = [0.2, 0.9]

# 3. Rear-first collapse (setup depth: 0 front rank, 1 rear rank).
rear_first_min_depth = 0.6

# 4. Lateral spread.
spread_min_rho = 0.3
spread_s = [10.0, 900.0]

# 5. Casualty asymmetry.
asymmetry_min_after_break = 0.6

# 6. Holds, then breaks. "Never" is still unbroken two hours after contact, so a line whose
# chance of breaking is constant can pass (mean time to break 47-87 minutes). The shape of the
# time to break is reported for each cell, not banded (Varro, call 0001 turn 10).
holds_early_s = 300.0
holds_max_early = 0.1
holds_never_s = 7200.0
holds_max_never = 0.25

# 7. The casualty clock.
clock_hits_per_file_hour = [0.1, 2.0]
# Either man disabled or killed in one committed bout: an outer envelope. The upper end is
# from the skeletal and experimental half of S0.4 (docs/slice0/lethality-skeletal.md). The
# lower end was Varro's to set, and he moved it from 0.005 to 0.002 on the other half
# (docs/slice0/lethality-line-fighting.md). Paullus signed it on 2026-11-10.
clock_lethality_per_bout = [0.002, 0.15]
