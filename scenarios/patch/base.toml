# The Slice 0 patch: two centuries side by side against a warband of equal numbers, on open
# ground. Wide enough for a break to spread along the line, deep enough to have rear ranks.
#
# Frontage per man is a parameter, not a finding (docs/vision/03 sec. 1). The Roman 1.8 m
# follows one reading of Polybius 18.30 (three feet for the man and three to his neighbours;
# from memory, to be checked against the Greek before S0.3). Variants change it.

name = "patch-base"
seed = 1
duration_s = 3600

