# The Slice 0 patch: two centuries side by side against a warband of equal numbers, on open
# ground. Wide enough for a break to spread along the line, deep enough to have rear ranks.
#
# Frontage per man is a parameter, not a finding (docs/vision/03 sec. 1). The Roman 1.8 m by
# 1.8 m follows Polybius 18.30.6-9, checked against the Greek (Buettner-Wobst): the Roman stands
# in three feet like a phalangite but needs at least three feet of clearance toward the man
# beside and the man behind, so one Roman faces two phalangites. Six feet is about 1.8 m, and
# it is a minimum. Variants change it.

name = "patch-base"
seed = 1
duration_s = 7800

[[body]]
name = "hastati, first century"
side = "A"
troop = "hastati"
files = 10
ranks = 8
file_mm = 1800
rank_mm = 1800
centre_mm = [-9000, 0]
facing_deg = 0
leader = "front-right"
closer = true

[[body]]
name = "hastati, second century"
side = "A"
troop = "hastati"
files = 10
ranks = 8
file_mm = 1800
rank_mm = 1800
centre_mm = [-9000, -18000]
facing_deg = 0
leader = "front-right"
closer = true

[[body]]
name = "warband"
side = "B"
troop = "gallic-warband"
files = 20
ranks = 8
file_mm = 1000
rank_mm = 1200
centre_mm = [9000, -9000]
facing_deg = 180
leader = "front-centre"
tie = "loose"

# The warband comes on; the Romans stand to receive it. Its frame halts just out of reach
# (the tie's standoff); from there, whether anyone steps forward is the men's business.
[[order]]
body = "warband"
at_s = 0
order = "advance"
