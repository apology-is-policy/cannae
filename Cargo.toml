[workspace]
resolver = "3"
members = [
    "crates/cannae-core",
    "crates/cannae-gauges",
    "crates/cannae-harness",
    "crates/cannae-man",
    "crates/cannae-pairwise",
]

[workspace.package]
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
float_arithmetic = "warn"

[profile.release]
debug = 1

# The runner tests simulate minutes of battle; unoptimised they are needlessly slow.
[profile.test]
opt-level = 1
